		</div>
		<div class="ps-room scrollable" id="room-">
			<div class="mainmenu">
				<div id="loading-message" class="mainmessage">Loading... <noscript>FAILED<br /><br />Pok&eacute;mon Showdown requires JavaScript.</noscript></div>
			</div>

					<a href="//pokemonshowdown.com/rules" target="_blank">Rules</a> | <a href="//pokemonshowdown.com/credits" target="_blank">Credits</a> | <a href="//pokemonshowdown.com/privacy" target="_blank">Privacy</a>
				</small>

		</div>

	<script>
		function linkStyle(url) {
			var linkEl = document.createElement('link');
			linkEl.rel = 'stylesheet';
			linkEl.href = url;
			document.head.appendChild(linkEl);
		}
		linkStyle("style/sim-types.css");
		linkStyle("style/teambuilder.css");
		linkStyle("style/battle-search.css");
		linkStyle("style/font-awesome.css");
	</script>
	<script src="https://play.pokemonshowdown.com/config/config.js"></script>
	<script>
		if (!window.Config) {
			// offline
			window.Config = {
				version: '0',
				bannedHosts: [],
				whitelist: [],
				routes: {
					root: "pokemonshowdown.com",
					client: "play.pokemonshowdown.com",
					dex: "dex.pokemonshowdown.com",
					replays: "replay.pokemonshowdown.com",
					users: "pokemonshowdown.com/users"
				},
				defaultserver: {
					id: 'showdown',
					host: 'sim3.psim.us',
					port: 443,
					httpport: 8000,
					altport: 80,
					registered: true
				},
				customcolors: {}
			};
		}
		function loadRemoteData(src) {
			var scriptEl = document.createElement('script');
			scriptEl.src = src.replace(/.*\/(data|js)\//g, 'https://play.pokemonshowdown.com/$1/');
			document.head.appendChild(scriptEl);
		}
		Config.testclient = true;
		(function() {
			if (location.search !== '') {
				var m = /\?~~(([^:\/]*)(:[0-9]*)?)/.exec(location.search);
				if (m) {
					Config.defaultserver = {
						id: m[1],
						host: m[2],
						port: (m[3] && parseInt(m[3].substr(1))) || 8000
					};
				} else {
					alert('Unrecognised query string syntax: ' + location.search);
				}
			} else {
				// Fasher Draft League: default to the same origin this page was
				// loaded from (instead of hardcoding localhost), so this same
				// build works whether it's loaded locally, through a tunnel, or
				// embedded directly in the game server's own static file
				// serving. httpport must be truthy for the client to use
				// wss:// instead of ws:// - required when served over https
				// (e.g. through the Cloudflare tunnel, which terminates TLS at
				// the edge even though our backend only speaks plain http/ws).
				var isHttps = document.location.protocol === 'https:';
				var port = document.location.port ? parseInt(document.location.port) : (isHttps ? 443 : 8000);
				Config.defaultserver = {
					id: document.location.hostname,
					host: document.location.hostname,
					port: port,
					httpport: isHttps ? port : undefined
				};
			}
		})();
	</script>
